# Render Blueprint for the Time-Thread backend
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: time-thread-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GOOGLE_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Comma-separated, for example https://your-app.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: DAILY_PROCESS_LIMIT
        value: "25"
      - key: READ_ONLY_MAPS
        value: "true"
